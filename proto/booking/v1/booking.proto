syntax = "proto3";

package booking.v1;

import "googleapis/google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/nhassl3/hairdress_arz_52/pkg/pb/booking/v1;bookingv1";

service BookingService{
  rpc CreateBooking(CreateBookingRequest) returns (CreateBookingResponse) {
    option (google.api.http) = {
      post: "/api/v1/booking/create"
      body: "*"
    };
  }

  rpc GetBookings(GetBookingRequest) returns (GetBookingResponse) {
    option (google.api.http) = {
      get: "/api/v1/booking"
    };
  }

  rpc UpdateBookingStatus(UpdateBookingStatusRequest) returns (UpdateBookingStatusResponse) {
    option (google.api.http) = {
      patch: "/api/v1/booking",
      body: "*"
    };
  }
}

message CreateBookingRequest {
  string username = 1;
  string hairdresser_id = 2;
  int32 service_id = 3;
  int32 salon_id = 4;
  google.protobuf.Timestamp starts_at = 5;
  google.protobuf.Timestamp ends_at = 6;
  string description = 7;
  StatusBooking status = 8;
}

message CreateBookingResponse {
  Bookings booking = 1;
}

message GetBookingRequest {
  oneof method {
    string username = 1;
    int64 id = 2;
    string hairdresser_id = 3;
    int32 service_id= 4;
    int32 salon_id = 5;
  }
}

message FindByUsername {
  string username = 1;
  google.protobuf.Timestamp starts_at = 2;
}

message FindByHairdresser {
  string hairdresser_id = 1;
  google.protobuf.Timestamp starts_at = 2;
}

message FindByService {
  int32 service_id = 1;
  google.protobuf.Timestamp starts_at = 2;
}

message FindBySalon {
  int32 salon_id = 1;
  google.protobuf.Timestamp starts_at = 2;
}

message UpdateBookingStatusRequest {
  oneof method {
    FindByUsername find_by_username = 1;
    int64 id = 2;
    FindByHairdresser find_by_hairdresser = 3;
    FindByService find_by_service = 4;
    FindBySalon find_by_salon = 5;
  }
  StatusBooking new_status = 6;
}

message UpdateBookingStatusResponse {
  Bookings booking = 1;
}

message GetBookingResponse {
  repeated Bookings bookings = 1;
}

enum StatusBooking {
  BOOKING_STATUS_UNSPECIFIED = 0;
  BOOKING_STATUS_PENDING = 1;
  BOOKING_STATUS_CONFIRMED = 2;
  BOOKING_STATUS_COMPLETED = 3;
  BOOKING_STATUS_CANCELLED = 4;
  BOOKING_STATUS_NO_SHOW = 5;
}

message Bookings {
  int64 id = 11;
  string username = 1;
  string hairdresser_id = 2;
  int32 service_id = 3;
  int32 salon_id = 4;
  google.protobuf.Timestamp starts_at = 5;
  google.protobuf.Timestamp ends_at = 6;
  string description = 7;
  StatusBooking status = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}